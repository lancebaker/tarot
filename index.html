                    id: "14-temperance",
                    image: "images/14-temperance.jpg",
                    number: "XIV",
                    name: "Temperance",
                    suit: "Major Arcana",
                    keywords: "Balance, Moderation, Harmony, Integration, Blending of Opposites, The Alchemical Union, Healing, Harmony, The Functional Mean, Creative Blending, Temperance, Serenity, Synthesis, The Integration of Differences, Wholeness",
                    traditional: "Balance, moderation, harmony, and the blending of opposites into wholeness. Temperance represents the capacity to find the middle way, to mix and balance opposing forces, to create harmony from discord. When this card appears, it often suggests a time of finding balance, of healing, of bringing different parts together in new ways.",
                    jungian: "The Coniunctio & Integration of Opposites:: Temperance represents the alchemical principle of blending, mixing, and creating something new from opposing elements. In Jungian terms, this is the principle of the coniunctio—the union of opposites that creates a third thing, something entirely new. Unlike Justice which shows the balance of opposites in opposition, Temperance shows the creative blending and integration of opposites. This is the principle at the heart of individuation—you don't eliminate your shadow or your opposite drives; you blend them together in new ways. The Healing & the Mean:: Temperance represents the principle of the mean—not the average, but the functional balance point that allows systems to work optimally. Psychologically, this is the understanding that extremes of any kind (too much anger or too little anger, too much connection or too much isolation) lead to dysfunction. Integrated maturity means finding the functional balance point within yourself—having access to all your capacities while not being driven by any single one.",
                    shadow: "The shadow Temperance is the person who refuses to take a stand, who tries to be all things to all people, who never commits because they're trying to balance everything. The shadow can be the false moderation—you're suppressing your authentic intensity in the name of balance. The shadow can also be the imbalance masquerading as moderation—you think you're balanced but you're actually just in denial about your extremes. There's also the shadow of stagnation—everything is balanced and nothing ever changes because you're so focused on maintaining equilibrium.",
                    integration: "Integrating Temperance means developing the capacity to blend seemingly opposite needs and capacities in functional ways. You can be both strong and gentle, both active and receptive, both individual and connected. You understand that real balance is not static but dynamic—like a tightrope walker, you're constantly making micro-adjustments to stay upright. Integrated Temperance energy means you can express your authentic intensity while also remaining aware of your impact on others. You can commit to one direction while also honoring other valid needs. You've developed enough self-knowledge to know when you're at your optimal balance point and when you're tipping into extremes. You become a healing presence because you've integrated your opposites and are no longer projecting them onto others.",
                    howToUse: "As Pairing: Temperance with Two of Pentacles suggests balance and juggling. With Strength: power and gentleness. Temperance asks: Where is balance needed? How can opposites work together?"
                },
                {
                    id: "15-devil",
                    image: "images/15-devil.jpg",
                    number: "XV",
                    name: "The Devil",
                    suit: "Major Arcana",
                    keywords: "Bondage, Shadow, Repressed Desire, Temptation, Addiction, Chains of Your Own Making, Possession, What You're Bound To, Sexuality, Aggression, Authentic Desire, The Shadow, Power, Despair, Reclamation of Power, The Dark Self",
                    traditional: "Bondage, temptation, attachment, and the chains of your own making. The Devil represents the things you're bound to—whether addictions, unhealthy relationships, limiting beliefs, or shadow patterns—that you could leave but feel powerless to. It speaks to the ways you give your power away or bind yourself through false desires and compulsions.",
                    jungian: "The Shadow & the Repressed:: The Devil represents the shadow in its most powerful form—all that you've rejected, repressed, and denied about yourself has accumulated immense energy. In Jungian terms, what you refuse to acknowledge in yourself, you experience as external threat or you become possessed by it. The Devil is the manifestation of all the disowned parts of yourself demanding recognition. The chains people wear in Devil cards are often loose or easy to escape—the point is that we're bound largely by our own unconscious agreements and beliefs. The Power of Repressed Desire:: The Devil also represents desire itself—particularly the desires that culture teaches you are wrong or unacceptable. Sexuality, aggression, greed, envy, selfishness—all the things that are actually part of human nature but that you've been taught to suppress. When repressed, these desires accumulate power and begin to drive you unconsciously. When acknowledged and integrated, they can be channeled creatively. The Devil at the crossroads asks: Will you continue to deny your authentic desires, or will you acknowledge them and make conscious choices about how to work with them?",
                    shadow: "The shadow Devil is the person who is genuinely enslaved—either by actual external forces or by their own unconscious drives that have become so powerful they feel external. The shadow can also be the person who has made a \"deal with the devil\"—you've achieved external success or pleasure at the cost of your authentic self or your integrity. The shadow can manifest as despair—you're so convinced of your own powerlessness that you've stopped trying. There's also the shadow of cruel indulgence—you know what you're doing is harming yourself and others, and you do it anyway, claiming \"at least I'm being authentic.\"",
                    integration: "Integrating The Devil means reclaiming your power by acknowledging what you're bound to and choosing consciously whether to remain bound. You look directly at your addictions, your attachments, your unhealthy patterns, and you ask: What am I getting from this? What fear is keeping me bound? What authentic desire is being expressed through this distorted channel? Integrated Devil energy means you've acknowledged your shadow thoroughly enough that you're no longer possessed by it. You've integrated your repressed desires and can express them in ways that don't harm you or others. You understand your own susceptibility to temptation without judging yourself for it. You recognize the deals you've made and you consciously choose which ones to honor and which to break. You've reclaimed your power.",
                    howToUse: "As Pairing: Devil with Strength suggests shadow and light. With The Fool: freedom and bondage. Devil asks: What chains are you ready to break? What shadow are you ready to face?"
                },
                {
                    id: "16-tower",
                    image: "images/16-tower.jpg",
                    number: "XVI",
                    name: "The Tower",
                    suit: "Major Arcana",
                    keywords: "Sudden Collapse, Breakthrough, Revelation, Crisis, Shattering of Illusion, False Structures, Ego Death, Destruction and Rebirth, Liberation Through Crisis, The Flash of Truth, Necessary Destruction, Humiliation, The Breaking Down, What Crumbles, What Remains",
                    traditional: "Sudden collapse, revelation, breakthrough, and the shattering of illusion. The Tower represents the moment when your false structures come crashing down, when you can no longer maintain illusions, when something you thought was solid reveals itself to be built on false ground. When this card appears, it often signals a crisis, a revelation, or a necessary destruction of what wasn't working.",
                    jungian: "The Shattering of the Ego & the Descent into the Unconscious:: The Tower represents the moment when the ego's carefully constructed structures—its defenses, its certainties, its sense of control—collapse in the face of unconscious forces. This is the entry into a profound ego-death experience where the self you thought you were proves to be much less solid than you believed. In Jungian terms, this is a crucial and necessary moment—the ego must be humbled before it can be properly integrated with the Self. All real transformation seems to require some version of Tower experience. The Liberation Through Crisis:: While The Tower is experienced as destructive, it can be liberating. What breaks down are the false structures—the persona you've been maintaining, the beliefs you've been clinging to, the illusions you've been defending. Once they're gone, you're free. The Tower is often the moment of breakthrough where you suddenly see clearly what you couldn't see before, where you're freed from a pattern or belief that had been constraining you.",
                    shadow: "The shadow Tower is the person who is entirely destroyed by the collapse and cannot rebuild. The shadow can be the bitterness—\"I was destroyed and the world is cruel and nothing is worth building.\" The shadow can also be the person who repeats the same collapse cycle—always building on false ground, always facing sudden collapse. There's also the shadow of inflicting Tower experiences on others—you destroy things and people in your path, claiming it's for their own good. The shadow can manifest as chaos for its own sake—you actively destroy things because you've given up on rebuilding.",
                    integration: "Integrating The Tower means developing the capacity to surrender your false structures when they no longer serve you, to accept crisis as sometimes necessary, to pass through the chaos and build something more authentic on the other side. You learn not to become so attached to your constructs that their collapse destroys you. Integrated Tower energy means you can distinguish between false foundations and true ones, you can let go of what needs to go without clinging, and you can rebuild on solid ground. You develop resilience—the capacity to be broken and reformed multiple times without losing your essential nature. You understand that the most important things cannot be destroyed by external collapse because they're rooted in the Self, not in external structures.",
                    howToUse: "As Pairing: Tower with The Star suggests destruction and hope. With Death: necessary endings. Tower asks: What's crumbling? Can you trust that something truer emerges?"
                },
                {
                    id: "17-star",
                    image: "images/17-star.jpg",
                    number: "XVII",
                    name: "The Star",
                    suit: "Major Arcana",
                    keywords: "Hope, Inspiration, Clarity, Vision, Alignment, True Purpose, Divine Guidance, The Self Within, Synchronicity, Eros, What Calls You, The Authentic Path, Reconnection, The Guiding Light, Wholeness",
                    traditional: "Hope, inspiration, clarity, and alignment with your true purpose. The Star represents the return of vision after darkness, the reconnection with what genuinely matters to you, the alignment with something larger than yourself. When this card appears, it suggests that clarity is returning, that you're being guided toward authentic purpose, that hope and inspiration are available.",
                    jungian: "Connection to the Self & Divine Guidance:: The Star represents the soul's connection to the Self—the deep organizing principle of your psyche that guides you toward wholeness. In Jungian terms, this is the moment when you feel aligned with your true nature, when your conscious intentions and your deeper calling are congruent. The Star is what you follow when you're lost—the constant point of reference that helps you navigate. The Star is also the representation of synchronicity and grace—the mysterious alignment of circumstances that supports your authentic unfolding. Inspiration & Eros:: The Star represents the principle of inspiration—the drawing toward, the magnetization of your being by what calls to you. This is eros in the deepest sense—not sexual, but the principle of being moved toward what resonates with your authentic nature. The Star is what draws you when you're following your authentic path. It's the thing that makes you feel alive and aligned.",
                    shadow: "The shadow Star can be false hope—holding onto an illusion of how things should be rather than seeing clearly what is. The shadow can also be the disconnection from true inspiration—you're following a star that's not actually yours, that you've adopted from others. The shadow can manifest as despair—the belief that your star is too distant, that alignment is impossible, that you're fundamentally disconnected from guidance. There's also the shadow of escapism—using visions of a better future to avoid doing what's required in the present.",
                    integration: "Integrating The Star means developing a genuine connection to your authentic purpose and inspiration, staying aligned with that even when the path is unclear, trusting that the guide is real even when you can't see the full destination. Integrated Star energy means you've found what genuinely matters to you and you're oriented toward it, you feel the difference between authentic inspiration and false hope, you trust your connection to guidance even in darkness. You understand that the Star is not external rescue; it's the representation of your own deepest alignment with your authentic self. You follow what calls to you even when others don't understand. You become a source of inspiration to others because you're visibly aligned with something real.",
                    howToUse: "As Pairing: Star with The Tower suggests hope after destruction. With The Sun: brightness and warmth. Star asks: What guides you? Where is your hope pointing?"
                },
                {
                    id: "18-moon",
                    image: "images/18-moon.jpg",
                    number: "XVIII",
                    name: "The Moon",
                    suit: "Major Arcana",
                    keywords: "Illusion, Intuition, Dreams, The Unconscious, The Hidden, Symbols, Imagination, Receptivity, The Anima, Fear, Mystery, Subtlety, Emotional Truth, What's Not Said, The Gateway, Psychic Knowing",
                    traditional: "Illusion, intuition, the unconscious, dreams, and the realm of imagination and possibility. The Moon represents the mysterious realm beneath conscious awareness, where logic doesn't apply and where truth is more subtle and symbolic than literal. When this card appears, it often suggests a time to pay attention to your intuition, your dreams, and what's not being said aloud.",
                    jungian: "The Gateway to the Unconscious:: The Moon represents the threshold between the conscious and unconscious mind. It's the light that illuminates the hidden, the guide that helps you navigate inner realms you cannot see clearly. In Jungian terms, the Moon is the Anima—the inner feminine principle of receptivity, intuition, imagination, and emotional knowing. The Moon shows you what's hidden, but it does so indirectly—through symbols, dreams, feelings, intuitions, rather than through clear logic. Illusion & Truth:: The Moon is also the card of illusion—and this is tricky, because the illusions of the Moon are sometimes more true than literal facts. The psyche's truth is symbolic and poetic, not literal. What appears as illusion to the logical mind is revelation to the intuitive mind. The Moon asks: Can you trust what you feel even though you can't prove it? Can you navigate by the light of imagination and intuition?",
                    shadow: "The shadow Moon is the person who is lost in illusion—who cannot distinguish between what's real and what's projected, who is driven by unconscious fears and compulsions they don't understand. The shadow can be psychotic or approaching it—so detached from logical reality that you can't function. The shadow can also be the person who uses mysticism and intuition as an excuse to avoid clear thinking. There's the shadow of being consumed by fears—the Moon also represents fear, the unknown that seems dangerous. The shadow can manifest as nightmares, paranoia, and the sense that nothing is safe.",
                    integration: "Integrating The Moon means developing a genuine relationship with your intuition and the unconscious without losing your grounding in logical reality. You can navigate by intuition without being swept away by it, you can work with symbols and dreams without believing they're literal truth, you can honor the subtle realm of emotion and imagination without dismissing the practical realm of logic and action. Integrated Moon energy means you trust your emotional and intuitive knowing as information, but you also verify it with your other faculties. You dream vividly and pay attention to dreams without trying to force them into literal meaning. You can move through fear and illusion without being destroyed by them. You understand that the deepest truths are often conveyed through myth and symbol rather than literal statement.",
                    howToUse: "As Pairing: Moon with The High Priestess suggests deep unconscious work. With The Sun: illusion and clarity. Moon asks: What are you afraid of? What is your unconscious trying to tell you?"
                },
                {
                    id: "19-sun",
                    image: "images/19-sun.jpg",
                    number: "XIX",
                    name: "The Sun",
                    suit: "Major Arcana",
                    keywords: "Clarity, Joy, Success, Enlightenment, Consciousness, Full Illumination, Achievement, Happiness, Victory, Authenticity, The Conscious Self, Radiance, Truth, Vitality, Expansion, The Integrated Self",
                    traditional: "Joy, success, enlightenment, clarity, and the fullness of consciousness. The Sun represents everything revealed, understood, and brought into light. It's the card of success, happiness, and the clarity that comes from full illumination. When this card appears, it often suggests a time of joy, achievement, and everything becoming clear.",
                    jungian: "The Conscious Self & Full Illumination:: The Sun represents consciousness in its fullest expression—where everything is revealed, nothing is hidden, and you understand what's really going on. In Jungian terms, this is the moment of full consciousness, where the shadow has been integrated enough that it no longer blinds you, where the unconscious has been acknowledged enough that it no longer possesses you, where you see clearly. The Sun is everything The Moon is not—clarity instead of illusion, certainty instead of mystery, light instead of shadow. The Integration Complete:: The Sun often appears after the initiation of The Hermit, The Hanged Man, Death, The Devil, and The Tower. All of that inner work pays off, and consciousness expands into new clarity. The Sun represents the moment where the work becomes play, where the difficult becomes easy, where you're aligned with what you're doing and it all flows.",
                    shadow: "The shadow Sun can be the inflation—you think you've achieved full consciousness and you're now enlightened, and you use this as a way to become rigid and disconnected from real human experience. The shadow can also be the false clarity—you think you see clearly but you're actually just in denial, you've become attached to a particular view and you're blind to other perspectives. There's the shadow of glibness—everything is sunny and perfect, you refuse to acknowledge real difficulties or shadow. The shadow can manifest as burnout—you've been living in the sun too long and you're exhausted.",
                    integration: "Integrating The Sun means developing the capacity to see clearly—to understand the truth of situations, to recognize your own strengths and capabilities, to feel genuinely happy and successful without becoming grandiose or attached to how things appear. Integrated Sun energy means you can maintain clarity even in complex situations, you can acknowledge both light and shadow without being destroyed by the shadow, you can be joyful without being manic. You understand that the Sun's light is naturally rhythmic—it's day and night, not eternal day. You can be happy and clear while also remaining humble and aware that new learning is always available.",
                    howToUse: "As Pairing: Sun with The Moon suggests light and dark in balance. With The Star: hope realized. Sun asks: What are you celebrating? How does success feel?"
                },
                {
                    id: "20-judgement",
                    image: "images/20-judgement.jpg",
                    number: "XX",
                    name: "Judgement",
                    suit: "Major Arcana",
                    keywords: "Awakening, Reckoning, Call to Action, Transformation, The Voice of the Self, Resurrection, New Consciousness, The Higher Call, Significant Transition, Becoming, Rising Up, The Sounding of the Trumpet, The Final Judgment, Rebirth, Irreversible Change",
                    traditional: "Reckoning, awakening, transformation, and the call to step into a new level of consciousness. Judgement represents the moment of awakening where you recognize that you must answer to a higher calling, where you see yourself and your life from a larger perspective, where you're called to change fundamentally. When this card appears, it often suggests a time of significant transition and the need to make important choices.",
                    jungian: "The Call of the Self:: Judgement represents the voice of the Self calling you toward your authentic destiny. Unlike the external judgment of Justice, this is internal—the recognition that you must answer to something larger than yourself. In Jungian terms, this is the Self calling you toward individuation, asking you to become fully yourself. The card often appears at crucial transition points in life where you must let go of who you've been in order to become who you're meant to be. Resurrection & New Consciousness:: Judgement represents the resurrection that follows death—but this is not going back to who you were; it's being reborn as a new, more conscious version of yourself. You cannot return to your previous level of consciousness once you've awakened. Judgement is the acknowledgment of this irreversible transformation.",
                    shadow: "The shadow Judgement can be the harsh internal critic—the judge that condemns you for not measuring up to impossible standards. The shadow can also be the refusal to hear the call—you know you're being called to something larger but you're ignoring it, distracting yourself, refusing to face what's required. There's the shadow of projection—judging others harshly rather than hearing your own call. The shadow can manifest as despair—the belief that you've failed, that your judgment is failure, that there's no resurrection possible for you.",
                    integration: "Integrating Judgement means developing the capacity to hear the call of the Self clearly and to respond authentically, even when it requires significant change. You can face yourself honestly without being destroyed by what you see, you can acknowledge where you've failed and learn from it, you can move forward transformed rather than remaining stuck in guilt. Integrated Judgement energy means you can see yourself and your life from a larger perspective without becoming grandiose. You understand that failure is information, not damnation. You hear the call to become more authentically yourself and you respond with commitment. You can face your own judgment and emerge stronger. You develop the capacity to judge situations and people fairly without becoming a harsh internal judge.",
                    howToUse: "As Pairing: Judgement with Death suggests death and rebirth. With The World: near completion. Judgement asks: What is calling you? How will you answer?"
                },
                {
                    id: "21-world",
                    image: "images/21-world.jpg",
                    number: "XXI",
                    name: "The World",
                    suit: "Major Arcana",
                    keywords: "Completion, Wholeness, Integration, Fulfillment, The End of a Cycle, Coming Home, The Self, Wholeness Achieved, Fulfillment, Return, The Journey Complete, The Integrated Self, Full Circle, Preparation for New Beginning, Divine Wholeness",
                    traditional: "Completion, wholeness, fulfillment, and the end of a cycle. The World represents the completion of the Fool's Journey—the return home, but transformed by the journey. It speaks to the sense of wholeness, of all pieces fitting together, of having come full circle. When this card appears, it often suggests the end of a significant phase and the preparation for a new beginning.",
                    jungian: "The Self in Wholeness & Individuation Complete:: The World represents the realization of the Self—the full integration of all parts of the psyche into a coherent whole. In Jungian terms, this is the goal of individuation—not to eliminate the shadow or the ego, but to integrate them into a larger whole under the direction of the Self. The World is the card of wholeness, of completing a cycle, of having become what you were meant to become. It's not the end of growth (that would be stagnation), but the completion of a chapter and the preparation for the next spiral of development. Return Home:: The World is also about coming home—returning to your essence, but transformed. You've left home in the Fool's Journey; you've been tested, broken down, rebuilt, integrated. Now you return, but you're not the same. This is the return home changed by the journey.",
                    shadow: "The shadow World can be attachment to a particular cycle—you've completed something important, but you refuse to move on, you try to perpetuate the completion indefinitely. The shadow can also be premature completion—you've convinced yourself you've finished when actually you've just reached a plateau. There's the shadow of stagnation—everything is complete and fixed and nothing new can emerge. The shadow can also be the disappointment—you've completed the cycle and reached the goal, but it doesn't satisfy like you thought it would.",
                    integration: "Integrating The World means celebrating completion while remaining open to new beginnings, finding wholeness without becoming rigid, understanding that each ending is also a beginning. Integrated World energy means you can appreciate how far you've come while also remaining humble about how much there still is to learn. You complete things well—you don't just abandon them halfway through. You understand that life is cyclical—each completion brings a new beginning at a higher level. You carry the wisdom of one cycle into the next. You feel the satisfaction of integration while remaining open to the next phase of growth. You've become yourself, and you're ready for whatever comes next.",
                    howToUse: "As Pairing: World with The Fool suggests ending and beginning. With The Sun: completion and joy. World asks: What have you completed? What's the next journey?"
                }
            ],
            cups: [
                {
                    id: "ace-cups",
                    image: "images/ace-cups.jpg",
                    name: "Ace of Cups",
                    suit: "Cups",
                    keywords: "New Feeling, Emotional Beginning, Love, Joy, Overflow, The Open Heart, Eros, Receptivity, Spiritual Blessing, Authentic Emotion, The Feeling Function, Vulnerability, Connection",
                    traditional: "New emotional beginning, love, joy, and the opening of the heart. The Ace of Cups is the pure potential of feeling—an overflow of genuine emotion, spiritual blessing, or the start of a meaningful relationship. When it appears, something tender and true is being offered: a chance to feel deeply, to receive love, or to let the heart lead.",
                    jungian: "Emotional Potential Emerging from the Unconscious: The Ace of Cups represents the first stirring of authentic feeling from the deep psyche. In Jungian terms, it is the anima or the feeling function awakening—the capacity to value, to connect, and to be moved. The cup overflows because the unconscious is offering more than the ego can yet hold; the task is to receive without grasping or defending. This is eros in its nascent form: the pull toward relatedness and meaning through the heart rather than through will or intellect alone. The Spiritual Gift of Feeling: Unlike sentimentality, the Ace points to feeling as a psychic function equal to thinking. When this card appears, the Self may be inviting a more complete relationship to emotion—one that does not drown in it, nor dry it out into analysis.",
                    shadow: "The shadow Ace of Cups is emotional flooding or emotional inflation—being overwhelmed by feeling and calling it depth, or idealizing a new connection so completely that reality cannot enter. It can also be the refusal of the gift: the cup is offered and you turn away, defending against vulnerability with cynicism or numbness. There is the shadow of addictive longing—chasing the high of new feeling without the capacity to sustain relationship. The shadow may also spiritualize emotion in a way that bypasses real human messiness.",
                    integration: "Integrating the Ace of Cups means learning to receive feeling without being destroyed by it or dismissing it. You open to love, joy, grief, and connection while maintaining enough ego strength to stay present. You distinguish genuine emotional opening from fantasy or compulsion. You allow the heart to inform your life without abandoning discernment. The gift is accepted, grounded, and allowed to grow into form.",
                    howToUse: "Pair with: Two of Cups (mutual connection), Four of Cups (receiving), Ten of Cups (family/belonging)"
                },
                {
                    id: "two-cups",
                    image: "images/two-cups.jpg",
                    name: "Two of Cups",
                    suit: "Cups",
                    keywords: "Partnership, Mutual Affection, Genuine Connection, Intimacy, Reciprocity, Coniunctio, Anima/Animus Meeting, Equality, Bond, Relatedness, The Heart's Recognition",
                    traditional: "Partnership, mutual affection, genuine connection, and the recognition of another. The Two of Cups is the meeting of two hearts—attraction that is reciprocal, a bond forming, or the healing of relationship through mutual seeing. It speaks to equality, respect, and the chemistry of true relatedness.",
                    jungian: "The Union of Self and Other: The Two of Cups is an early form of the coniunctio—two beings recognizing each other authentically. Psychologically it represents the capacity for intimacy: to be seen and to see without losing oneself. In Jungian terms, this often involves projection of the anima or animus; the work is to enjoy the connection while gradually reclaiming what belongs to the inner figure. Integration of Feeling and Relatedness: This card marks the moment when solitary feeling (Ace) becomes relational. The ego learns that meaning is not only private but co-created. Healthy Two of Cups energy holds both autonomy and bond.",

        // ──── FILTER & DISPLAY LOGIC ────

        const contentEl = document.getElementById('content');
        const majorSelect = document.getElementById('majorSelect');
        const cupsSelect = document.getElementById('cupsSelect');
        const swordsSelect = document.getElementById('swordsSelect');
        const wandsSelect = document.getElementById('wandsSelect');
        const pentaclesSelect = document.getElementById('pentaclesSelect');
        const searchInput = document.getElementById('searchInput');

        // Populate dropdowns
        function populateDropdowns() {
            cardData.major.forEach(card => {
                const option = document.createElement('option');
                option.value = card.id;
                option.textContent = `${card.number}. ${card.name}`;
                majorSelect.appendChild(option);
            });

            [cupsSelect, swordsSelect, wandsSelect, pentaclesSelect].forEach((select, i) => {
                const suits = ['cups', 'swords', 'wands', 'pentacles'];
                const suit = suits[i];
                cardData[suit].forEach(card => {
                    const option = document.createElement('option');
                    option.value = card.id;
                    option.textContent = card.name;
                    select.appendChild(option);
                });
            });
        }

        // Find card by ID
        function findCard(id) {
            for (const suit in cardData) {
                const card = cardData[suit].find(c => c.id === id);
                if (card) return card;
            }
            return null;
        }

        // Switch between pages
        function switchPage(page) {
            document.querySelectorAll('.nav-button').forEach(btn => btn.classList.remove('active'));
            
            if (page === 'dictionary') {
                document.getElementById('dictBtn').classList.add('active');
                renderMainPage();
            } else if (page === 'numerology') {
                document.getElementById('numerologyBtn').classList.add('active');
                renderNumerologyPage();
            } else if (page === 'suits') {
                document.getElementById('suitsBtn').classList.add('active');
                renderSuitsPage();
            }
            
            window.location.hash = '';
            searchInput.value = '';
            document.getElementById('suggestions').classList.remove('active');
        }

                        <h3 style="font-family: Georgia, serif; font-size: 1.5rem; color: var(--brown-dark); margin-bottom: 0.5rem;">Wands</h3>
                        <p style="font-size: 0.95rem; color: var(--brown-light); font-style: italic; margin-bottom: 1rem;">Element: Fire</p>
                        <p style="color: var(--brown-dark); line-height: 1.8; margin-bottom: 1rem;"><strong>Domain:</strong> Passion, creativity, action, will, energy, inspiration, transformation. Wands ignite and drive forward momentum.</p>
                        <p style="color: var(--brown-dark); line-height: 1.8; margin-bottom: 1rem;"><strong>Key Themes:</strong> Creativity, passion, action, inspiration, growth, potential, adventure, courage, drive, ambition, transformation, sexual energy, enthusiam.</p>
                        <p style="color: var(--brown-dark); line-height: 1.8; margin-bottom: 1rem;"><strong>In a Reading:</strong> When many Wands appear, creative projects, passion, and forward momentum are central. Look for inspiration being offered or action being called for. Wands invite you to follow your passion and act boldly on what excites you.</p>
                        <p style="color: var(--brown-dark); line-height: 1.8;"><strong>Energy:</strong> Dynamic, passionate, creative, inspiring, ambitious, courageous, adventurous, seeking expression and transformation.</p>
                    </div>

                    <div style="background: white; border: 2px solid var(--wood); padding: 2rem;">
                        <h3 style="font-family: Georgia, serif; font-size: 1.5rem; color: var(--brown-dark); margin-bottom: 0.5rem;">Pentacles</h3>
                        <p style="font-size: 0.95rem; color: var(--brown-light); font-style: italic; margin-bottom: 1rem;">Element: Earth</p>
                        <p style="color: var(--brown-dark); line-height: 1.8; margin-bottom: 1rem;"><strong>Domain:</strong> Material world, practicality, resources, work, health, grounding, manifestation. Pentacles bring things into physical reality.</p>
                        <p style="color: var(--brown-dark); line-height: 1.8; margin-bottom: 1rem;"><strong>Key Themes:</strong> Money, resources, work, career, health, physical body, material security, practicality, abundance, manifestation, grounding, tangible results.</p>
                        <p style="color: var(--brown-dark); line-height: 1.8; margin-bottom: 1rem;"><strong>In a Reading:</strong> When many Pentacles appear, material matters, practical concerns, or physical health are significant. Look for resources, opportunities, or the need for grounding. Pentacles invite you to tend to practical matters and trust in your capacity to build something real.</p>
                        <p style="color: var(--brown-dark); line-height: 1.8;"><strong>Energy:</strong> Grounded, practical, stable, productive, nurturing, building, seeking security and tangible results.</p>
                    </div>
                </div>
            `;
            contentEl.innerHTML = suitsContent;
        }

        // Render main page with animated bouncing polygonal shapes
        function renderMainPage() {
            const bouncingGraphic = `
                <div class="main-graphic">
                    <style>
                        @keyframes float1 { 0%, 100% { transform: translate(0, 0) rotate(0deg); } 25% { transform: translate(30px, -25px) rotate(90deg); } 50% { transform: translate(0, -50px) rotate(180deg); } 75% { transform: translate(-30px, -25px) rotate(270deg); } }
                        @keyframes float2 { 0%, 100% { transform: translate(0, 0) rotate(180deg); } 25% { transform: translate(-35px, 20px) rotate(225deg); } 50% { transform: translate(0, 40px) rotate(270deg); } 75% { transform: translate(35px, 20px) rotate(315deg); } }
                        @keyframes float3 { 0%, 100% { transform: translate(0, 0) rotate(45deg); } 25% { transform: translate(25px, 35px) rotate(135deg); } 50% { transform: translate(-20px, 45px) rotate(225deg); } 75% { transform: translate(-25px, 15px) rotate(315deg); } }
                        @keyframes float4 { 0%, 100% { transform: translate(0, 0) rotate(270deg); } 25% { transform: translate(-25px, -35px) rotate(315deg); } 50% { transform: translate(20px, -45px) rotate(45deg); } 75% { transform: translate(25px, -15px) rotate(135deg); } }
                        @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
                        
                        .polygon-container { position: relative; width: 300px; height: 300px; margin: 0 auto; }
                        .poly { position: absolute; top: 50%; left: 50%; animation: linear infinite; }
                        .poly1 { animation-name: float1; animation-duration: 6s; }
                        .poly2 { animation-name: float2; animation-duration: 7s; }
                        .poly3 { animation-name: float3; animation-duration: 5s; }
                        .poly4 { animation-name: float4; animation-duration: 8s; }
                        svg { filter: drop-shadow(0 4px 8px rgba(107, 83, 68, 0.15)); }
                    </style>
                    <div class="polygon-container">
                        <div class="poly poly1">
                            <svg width="80" height="80" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
                                <polygon points="40,10 70,30 60,65 20,65 10,30" fill="#A89968" opacity="0.7"/>
                                <polygon points="40,10 70,30 60,65 20,65 10,30" fill="none" stroke="#6B5344" stroke-width="1.5"/>
                            </svg>
                        </div>
                        <div class="poly poly2">
                            <svg width="70" height="70" viewBox="0 0 70 70" xmlns="http://www.w3.org/2000/svg">
                                <polygon points="35,5 65,25 55,60 15,60 5,25" fill="#8B7355" opacity="0.6"/>
                                <polygon points="35,5 65,25 55,60 15,60 5,25" fill="none" stroke="#A89968" stroke-width="1.5"/>
                            </svg>
                        </div>
                        <div class="poly poly3">
                            <svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">
                                <polygon points="30,10 50,20 45,45 15,45 10,20" fill="#5C6B4D" opacity="0.5"/>
                                <polygon points="30,10 50,20 45,45 15,45 10,20" fill="none" stroke="#A89968" stroke-width="1"/>
                            </svg>
                        </div>
                        <div class="poly poly4">
                            <svg width="75" height="75" viewBox="0 0 75 75" xmlns="http://www.w3.org/2000/svg">
                                <polygon points="37,8 62,28 58,62 16,62 12,28" fill="#6B5344" opacity="0.5"/>
                                <polygon points="37,8 62,28 58,62 16,62 12,28" fill="none" stroke="#A89968" stroke-width="1.5"/>
                            </svg>
                        </div>
                    </div>
                </div>
            `;
            contentEl.innerHTML = bouncingGraphic;
        }

        // Get all cards
        function getAllCards() {
            let allCards = [];
            for (const suit in cardData) {
                allCards = allCards.concat(cardData[suit]);
            }
            return allCards;
        }

        // Search cards
        function searchCards(query) {
            if (!query) return getAllCards();
            const q = query.toLowerCase();
            return getAllCards().filter(card =>
                card.name.toLowerCase().includes(q) ||
                card.keywords.toLowerCase().includes(q)
            );
        }

        // Handle autocomplete search
        function handleSearchInput() {
            const query = searchInput.value.trim();
            const suggestionsEl = document.getElementById('suggestions');

            if (query.length === 0) {
                suggestionsEl.classList.remove('active');
                return;
            }

            const results = searchCards(query);
            if (results.length === 0) {
                suggestionsEl.classList.remove('active');
                return;
            }

            const html = results.map(card => `
                <div class="suggestion-item" onclick="navigateToCard('${card.id}')">
                    <span class="suggestion-name">${card.name}</span>
                    <span class="suggestion-suit">${card.suit}</span>
                </div>
            `).join('');

            suggestionsEl.innerHTML = html;
            suggestionsEl.classList.add('active');
        }

        // Navigate to a card from autocomplete
        function navigateToCard(cardId) {
            window.location.hash = cardId;
            searchInput.value = '';
            document.getElementById('suggestions').classList.remove('active');
        }

        // Handle navigation
        function handleNavigation() {
            const hash = window.location.hash.slice(1);

            if (hash) {
                const card = findCard(hash);
                if (card) {
                    renderCardDetail(card);
                    return;
                }
            }

            // Main page: show alchemical circle
            renderMainPage();
        }

        // Event listeners
        // Dropdown selection: go straight to the chosen card, then reset the dropdown
        function handleDropdownChange(e) {
            const id = e.target.value;
            if (!id) return;
            e.target.value = '';
            if (window.location.hash.slice(1) === id) {
                handleNavigation(); // same card already in the URL: hashchange won't fire
            } else {
                window.location.hash = id;
            }
        }
        [majorSelect, cupsSelect, swordsSelect, wandsSelect, pentaclesSelect]
            .forEach(sel => sel.addEventListener('change', handleDropdownChange));
        searchInput.addEventListener('input', handleSearchInput);
        window.addEventListener('hashchange', handleNavigation);

        // Close suggestions when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrapper')) {
                document.getElementById('suggestions').classList.remove('active');
            }
        });

        // Initialize
        populateDropdowns();
        handleNavigation();
    </script>
</body>
</html>
