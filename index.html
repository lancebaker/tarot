                    shadow: "The shadow is the demand for a perfect family image, denial of conflict, enmeshment, or sacrificing the individual to the collective 'happy home.' It can also be despair when this ideal is unmet, or the false performance of harmony. Shadow work with Ten of Cups is not about self-attack; it is about honest recognition. Notice where you judge this energy in others while refusing it in yourself, or where you secretly indulge it while claiming the opposite virtue. In relationships, the shadow of this card often plays out as projection—seeing the problem as entirely 'out there.' In work and creativity, it may appear as a repeating pattern that undermines results. A useful practice is to write the shadow description in the first person ('I…') and notice what feels uncomfortably true. Integration begins when the disowned quality is given a legitimate, conscious channel rather than left to sabotage from the dark.",
                    reversed: "When Ten of Cups appears reversed, the upright themes of this card are present but delayed, internalized, blocked, or asking to be approached from the opposite angle. Where upright energy emphasizes movement into the world, the reverse often points to inner work first—or to the same force showing up as excess, avoidance, or misdirection. Classically, readers treat the reverse as a quieter, more private, or more complicated expression of the card rather than a simple 'opposite.' Upright core (Family harmony, emotional fulfillment, belonging, and lasting happiness in relationship) may be stalled: the invitation is still live, but timing, attitude, or outer conditions are not yet aligned. Shadow material is more likely to surface here: The shadow is the demand for a perfect family image, denial of conflict, enmeshment, or sacrificing the individual to the collective 'happy home. Ask whether you are resisting a necessary beginning, clinging past an ending, forcing an outcome, or denying a feeling that wants acknowledgment. Reversed does not always mean 'bad.' It can mean incubation, reconsideration, a no that protects you, or power reclaimed by not acting. In practice, read the reverse as a prompt: What would the healthy upright Ten of Cups look like if the obstacle were named honestly? What small correction restores flow? Keywords to hold lightly when reversed: blocked or excessive forms of Family; delay; internalization; recalibration.",
                    integration: "Integrating the Ten of Cups means building and maintaining relationships and communities that genuinely nourish all involved. You learn to create emotional security based on authentic connection rather than dependence, and to contribute to family or community wellness.

In practice, this means: investing in relationships that matter, creating a home and community that feels safe and welcoming, contributing to the wellbeing of those you're in relationship with, and maintaining the work that real harmony requires. Integrated Ten of Cups energy includes understanding that lasting connection requires ongoing attention and care.

Common pitfalls: The shadow becomes dependent on family for identity, tries to maintain false harmony by suppressing truth, or becomes so attached to this image that change and growth are resisted. True integration is real connection with room for authentic expression. The Ten completes the emotional journey through the Cups suit.",
                    howToUse: "As Description: Where is Ten of Cups already showing up in the querent's situation—attitude, relationship, timing, or inner state? Name it concretely. | As Invitation: What would it mean to lean into the healthy expression of Ten of Cups this week? Identify one small, embodied action. | As Warning / Shadow: Where might this energy be exaggerated, denied, or projected? What pattern repeats? | Position awareness: In a past position, Ten of Cups often shows a formative influence still shaping the present. In the present, it highlights the core dynamic to work with now. In the future or advice position, it suggests a stance to cultivate or a development that wants conscious participation rather than passive waiting. | With other cards: Pair Ten of Cups with challenging cards as a resource or corrective; with supportive cards as a confirmation of momentum. Majors nearby raise the archetypal stakes; suits show the life domain (Cups = feeling/bonds, Swords = mind/conflict, Wands = drive/creation, Pentacles = body/work/resources). | Diagnostic questions: What does Ten of Cups want me to stop doing? Start doing? What am I afraid will happen if I take this card seriously? What would 'enough' look like for this energy? | Practice: After the reading, choose one image or phrase from Ten of Cups and keep it in view for several days—on a note, in a journal, or as a deliberate pause before key decisions—so the card moves from information into relationship."

                    reversed: "When Ace of Swords appears reversed, the upright themes of this card are present but delayed, internalized, blocked, or asking to be approached from the opposite angle. Where upright energy emphasizes movement into the world, the reverse often points to inner work first—or to the same force showing up as excess, avoidance, or misdirection. Classically, readers treat the reverse as a quieter, more private, or more complicated expression of the card rather than a simple 'opposite.' Upright core (Truth, clarity, breakthrough, and the cutting edge of insight) may be stalled: the invitation is still live, but timing, attitude, or outer conditions are not yet aligned. Shadow material is more likely to surface here: The shadow is cruel honesty, intellectual inflation, and using truth as a blade to wound. Ask whether you are resisting a necessary beginning, clinging past an ending, forcing an outcome, or denying a feeling that wants acknowledgment. Reversed does not always mean 'bad.' It can mean incubation, reconsideration, a no that protects you, or power reclaimed by not acting. In practice, read the reverse as a prompt: What would the healthy upright Ace of Swords look like if the obstacle were named honestly? What small correction restores flow? Keywords to hold lightly when reversed: blocked or excessive forms of Truth; delay; internalization; recalibration.",
                    integration: "Integrating the Ace of Swords means developing the capacity for clear thinking without being cold or detached. You learn to speak truth with compassion, to think clearly even about emotional matters, and to cut through confusion without causing unnecessary harm.

                    shadow: "The shadow is verbal violence, righteousness on horseback, and trampling nuance and people. Impatience that destroys alliances, and ideology as a warhorse, belong here. Shadow work with Knight of Swords is not about self-attack; it is about honest recognition. Notice where you judge this energy in others while refusing it in yourself, or where you secretly indulge it while claiming the opposite virtue. In relationships, the shadow of this card often plays out as projection—seeing the problem as entirely 'out there.' In work and creativity, it may appear as a repeating pattern that undermines results. A useful practice is to write the shadow description in the first person ('I…') and notice what feels uncomfortably true. Integration begins when the disowned quality is given a legitimate, conscious channel rather than left to sabotage from the dark.",
                    reversed: "When Knight of Swords appears reversed, the upright themes of this card are present but delayed, internalized, blocked, or asking to be approached from the opposite angle. Where upright energy emphasizes movement into the world, the reverse often points to inner work first—or to the same force showing up as excess, avoidance, or misdirection. Classically, readers treat the reverse as a quieter, more private, or more complicated expression of the card rather than a simple 'opposite.' Upright core (Direct action, swift speech, intellectual combat, and charging toward a goal) may be stalled: the invitation is still live, but timing, attitude, or outer conditions are not yet aligned. Shadow material is more likely to surface here: The shadow is verbal violence, righteousness on horseback, and trampling nuance and people. Ask whether you are resisting a necessary beginning, clinging past an ending, forcing an outcome, or denying a feeling that wants acknowledgment. Reversed does not always mean 'bad.' It can mean incubation, reconsideration, a no that protects you, or power reclaimed by not acting. In practice, read the reverse as a prompt: What would the healthy upright Knight of Swords look like if the obstacle were named honestly? What small correction restores flow? Keywords to hold lightly when reversed: blocked or excessive forms of Swift Action; delay; internalization; recalibration.",
                    integration: "Integrating the Knight of Swords means pursuing truth and clarity while remaining compassionate and grounded. You learn to think clearly and speak truthfully without using your sharp mind as a weapon, and to seek understanding rather than victory.

In practice, this means: asking good questions, pursuing genuine understanding, communicating clearly and directly, and using your intellect in service of connection rather than domination. Integrated Knight of Swords energy includes sharp thinking with an open heart.

Common pitfalls: The shadow becomes argumentative and needs to win every debate, uses intellectual superiority as a defense, or cuts people down with sharp words. She can also get lost in abstract thinking and lose touch with feeling. True integration is truth-seeking that serves understanding.",
                    howToUse: "As Description: Where is Knight of Swords already showing up in the querent's situation—attitude, relationship, timing, or inner state? Name it concretely. | As Invitation: What would it mean to lean into the healthy expression of Knight of Swords this week? Identify one small, embodied action. | As Warning / Shadow: Where might this energy be exaggerated, denied, or projected? What pattern repeats? | Position awareness: In a past position, Knight of Swords often shows a formative influence still shaping the present. In the present, it highlights the core dynamic to work with now. In the future or advice position, it suggests a stance to cultivate or a development that wants conscious participation rather than passive waiting. | With other cards: Pair Knight of Swords with challenging cards as a resource or corrective; with supportive cards as a confirmation of momentum. Majors nearby raise the archetypal stakes; suits show the life domain (Cups = feeling/bonds, Swords = mind/conflict, Wands = drive/creation, Pentacles = body/work/resources). | Diagnostic questions: What does Knight of Swords want me to stop doing? Start doing? What am I afraid will happen if I take this card seriously? What would 'enough' look like for this energy? | Practice: After the reading, choose one image or phrase from Knight of Swords and keep it in view for several days—on a note, in a journal, or as a deliberate pause before key decisions—so the card moves from information into relationship."

                    image: "images/ace-wands.jpg",
                    traditional: "New material opportunity, seed of prosperity, and tangible potential. The Ace of Pentacles is the gift of a real chance—work, money, health, or a practical path opening in the world. You see this card when financial or material opportunity arrives, when health improves, when a practical opportunity is offered, or when you're being called to engage with the material world in a new way. This is the card of incarnate potential. Classically, the Ace represents new beginning in the realm of material manifestation. In traditional readings, this card signals that opportunity is available and that engaging with it practically will bring results.",
                    jungian: "Incarnation of Potential: Spirit seeks matter. Jung insisted that individuation must include the body and ordinary life; the Ace of Pentacles is the psyche's yes to incarnation—a new concrete possibility that can ground growth. The seed requires planting, not only admiration. From an archetypal view, Ace of Pentacles can appear when a particular complex or developmental task is constellating—when the psyche is ready (or overdue) to make something conscious. Sallie Nichols and related Jungian tarot readers emphasize that the cards map stages and attitudes of consciousness, not merely external events; thus the 'situation' in a spread is often the ego's current relationship to an inner figure or energy. Pay attention to bodily felt sense and dream echoes around this card: the unconscious often elaborates the same motif in parallel. Individuation does not mean rejecting the card's difficulty; it means relating to it with enough ego strength that the energy can be integrated rather than acted out or repressed. Ask: what part of me is speaking here, and what does it need in order to move toward greater wholeness?",
                    shadow: "The shadow is greed at the gate, reducing all value to money, or refusing the practical gift because it seems too ordinary for a 'spiritual' identity. Fear of material life also appears. Shadow work with Ace of Pentacles is not about self-attack; it is about honest recognition. Notice where you judge this energy in others while refusing it in yourself, or where you secretly indulge it while claiming the opposite virtue. In relationships, the shadow of this card often plays out as projection—seeing the problem as entirely 'out there.' In work and creativity, it may appear as a repeating pattern that undermines results. A useful practice is to write the shadow description in the first person ('I…') and notice what feels uncomfortably true. Integration begins when the disowned quality is given a legitimate, conscious channel rather than left to sabotage from the dark.",
                    reversed: "When Ace of Pentacles appears reversed, the upright themes of this card are present but delayed, internalized, blocked, or asking to be approached from the opposite angle. Where upright energy emphasizes movement into the world, the reverse often points to inner work first—or to the same force showing up as excess, avoidance, or misdirection. Classically, readers treat the reverse as a quieter, more private, or more complicated expression of the card rather than a simple 'opposite.' Upright core (New material opportunity, seed of prosperity, embodied beginning, and tangible potential) may be stalled: the invitation is still live, but timing, attitude, or outer conditions are not yet aligned. Shadow material is more likely to surface here: The shadow is greed at the gate, reducing all value to money, or refusing the practical gift because it seems too ordinary for a 'spiritual' identity. Ask whether you are resisting a necessary beginning, clinging past an ending, forcing an outcome, or denying a feeling that wants acknowledgment. Reversed does not always mean 'bad.' It can mean incubation, reconsideration, a no that protects you, or power reclaimed by not acting. In practice, read the reverse as a prompt: What would the healthy upright Ace of Pentacles look like if the obstacle were named honestly? What small correction restores flow? Keywords to hold lightly when reversed: blocked or excessive forms of Material Opportunity; delay; internalization; recalibration.",
                    integration: "Integrating the Ace of Pentacles means receiving and working the opportunity without inflation or undervaluing. You learn to honor matter as a field of meaning and to engage with practical life as sacred.

In practice, this means: saying yes to practical opportunities that serve your values, working with money and resources intentionally, caring for your health and body, and recognizing that material wellbeing supports spiritual life. Integrated Ace of Pentacles energy includes both ambition and integrity.

Common pitfalls: The shadow either dismisses material opportunities as beneath a spiritual identity, or becomes greedy and loses all other values in pursuit of money. She can also remain stuck in poverty mentality despite opportunities. True integration is receiving abundance as blessing and working with it wisely. The Ace begins the Pentacles journey of material engagement.",
                    howToUse: "As Description: Where is Ace of Pentacles already showing up in the querent's situation—attitude, relationship, timing, or inner state? Name it concretely. | As Invitation: What would it mean to lean into the healthy expression of Ace of Pentacles this week? Identify one small, embodied action. | As Warning / Shadow: Where might this energy be exaggerated, denied, or projected? What pattern repeats? | Position awareness: In a past position, Ace of Pentacles often shows a formative influence still shaping the present. In the present, it highlights the core dynamic to work with now. In the future or advice position, it suggests a stance to cultivate or a development that wants conscious participation rather than passive waiting. | With other cards: Pair Ace of Pentacles with challenging cards as a resource or corrective; with supportive cards as a confirmation of momentum. Majors nearby raise the archetypal stakes; suits show the life domain (Cups = feeling/bonds, Swords = mind/conflict, Wands = drive/creation, Pentacles = body/work/resources). | Diagnostic questions: What does Ace of Pentacles want me to stop doing? Start doing? What am I afraid will happen if I take this card seriously? What would 'enough' look like for this energy? | Practice: After the reading, choose one image or phrase from Ace of Pentacles and keep it in view for several days—on a note, in a journal, or as a deliberate pause before key decisions—so the card moves from information into relationship."

                    integration: "Integrating the Two of Pentacles means developing the flexibility and skill to manage multiple demands without dropping any. You learn to adapt to change and to maintain your center even amid complexity.

                    shadow: "The shadow is miserliness, fear-based control, and possessiveness toward people as well as things. Status anxiety and refusal to invest or share belong here. Shadow work with Four of Pentacles is not about self-attack; it is about honest recognition. Notice where you judge this energy in others while refusing it in yourself, or where you secretly indulge it while claiming the opposite virtue. In relationships, the shadow of this card often plays out as projection—seeing the problem as entirely 'out there.' In work and creativity, it may appear as a repeating pattern that undermines results. A useful practice is to write the shadow description in the first person ('I…') and notice what feels uncomfortably true. Integration begins when the disowned quality is given a legitimate, conscious channel rather than left to sabotage from the dark.",

                    integration: "Integrating the Four of Pentacles means finding genuine security that doesn't require constant hoarding or control. You learn to trust that your needs will be met without needing to cling to everything.

In practice, this means: examining your fear and scarcity beliefs, being generous when you can afford to be, taking calculated risks with money and resources, and developing faith in your ability to create what you need. Integrated Four of Pentacles energy includes both security and generosity.

Common pitfalls: The shadow becomes miserly and hoards despite abundance, uses scarcity as an excuse to refuse others, or swings to the opposite extreme of reckless spending to overcome fear. True integration is realistic management grounded in trust rather than fear. The Four marks the fear point where abundance becomes possible only by releasing control.",

                    integration: "Integrating the Six of Pentacles means practicing generosity while maintaining your own wellbeing, and learning to both give and receive. You develop the capacity to share your abundance without fear or resentment.

        // ──── FILTER & DISPLAY LOGIC ────

        const contentEl = document.getElementById('content');

        // Populate dropdowns
        function populateDropdowns() {
            cardData.major.forEach(card => {
                const option = document.createElement('option');
                option.value = card.id;
                option.textContent = `${card.number}. ${card.name}`;
                majorSelect.appendChild(option);
            });

            [cupsSelect, swordsSelect, wandsSelect, pentaclesSelect].forEach((select, i) => {
                const suits = ['cups', 'swords', 'wands', 'pentacles'];
                const suit = suits[i];
                cardData[suit].forEach(card => {
                    const option = document.createElement('option');
                    option.value = card.id;
                    option.textContent = card.name;
                    select.appendChild(option);
                });
            });
        }

        // Find card by ID
        function findCard(id) {
            for (const suit in cardData) {
                const card = cardData[suit].find(c => c.id === id);
                if (card) return card;
            }
            return null;
        }

        // Render card detail page
        // Escape text for safe HTML insertion (fixes & breaking titles like "Choice & Eros")
        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // Split long section text into readable paragraphs (content unchanged)
        function formatSectionHtml(text, options = {}) {
            if (!text) return '';
            const { isSpread = false } = options;

            if (isSpread && text.includes(' | ')) {
                return text.split(/\s*\|\s*/).map(part => {
                    const trimmed = part.trim();
                    if (!trimmed) return '';
                    const m = trimmed.match(/^([^:]{2,40}):\s*([\s\S]+)$/);
                    if (m) {
                        return `<p class="section-content spread-item"><strong>${escapeHtml(m[1])}:</strong> ${escapeHtml(m[2])}</p>`;
                    }
                    return `<p class="section-content spread-item">${escapeHtml(trimmed)}</p>`;
                }).join('');
            }

            // Jungian subsections marked with Title:: body — parse without breaking on & or single words
            if (text.includes('::')) {
                const blocks = [];
                // Match "Title:: body" where title is a short heading (not a full sentence)
                const re = /([A-Z][A-Za-z0-9 &,'\/\-]{0,70}?)::\s*/g;
                let lastEnd = 0;
                let match;
                const markers = [];
                while ((match = re.exec(text)) !== null) {
                    markers.push({ title: match[1].trim(), start: match.index, end: match.index + match[0].length });
                }
                if (markers.length > 0) {
                    // preamble before first title
                    if (markers[0].start > 0) {
                        const pre = text.slice(0, markers[0].start).trim();
                        if (pre) blocks.push(paragraphize(pre));
                    }
                    for (let i = 0; i < markers.length; i++) {
                        const bodyStart = markers[i].end;
                        const bodyEnd = i + 1 < markers.length ? markers[i + 1].start : text.length;
                        const body = text.slice(bodyStart, bodyEnd).trim();
                        blocks.push(`<h4 class="section-subtitle">${escapeHtml(markers[i].title)}</h4>`);
                        if (body) blocks.push(paragraphize(body));
                    }
                    return blocks.join('');
                }
            }

            return paragraphize(text);
        }

        function paragraphize(text) {
            const safe = escapeHtml(text.trim());
            const sentences = safe.match(/[^.!?]+[.!?]+(?:\s+|$)|[^.!?]+$/g);
            if (!sentences || sentences.length <= 2) {
                return `<p class="section-content">${safe}</p>`;
            }
            const paras = [];
            for (let i = 0; i < sentences.length; i += 2) {
                const chunk = sentences.slice(i, i + 2).join('').trim();
                if (chunk) paras.push(`<p class="section-content">${chunk}</p>`);
            }
            return paras.join('');
        }

        const SPREAD_FRAMES = {
            ppf: {
                label: 'Past · Present · Future',
                positions: [
                    { key: 'past', title: 'Past / Foundation', role: 'past' },

                ]

        function positionText(card, role) {
            const name = card.name;
            const kw = (card.keywords || '').split(',')[0].trim() || name;
            const shadowHint = card.shadow ? card.shadow.split('.')[0].trim() + '.' : '';
            const integHint = card.integration ? card.integration.split('.')[0].trim() + '.' : '';

            const map = {
                past: `${name} in the past/foundation position points to a formative influence still coloring the present. Look for where ${kw.toLowerCase()} began—or was refused—and how that story set the stage for today’s question. This is less “ancient history” and more “the root system still feeding the situation.”`,
                present: `As the present, ${name} names the energy most alive right now. Lead with its upright teaching when the situation is flowing; check the shadow if things feel stuck or charged. Ask: am I living the healthy form of ${name}, or am I circling its defensive version?`,
                future: `In a future or trajectory position, ${name} is a direction of travel—not a fixed fate. It describes the climate you’re moving toward if current attitudes continue, and the quality available if you cooperate with the card’s healthier expression. Course-correct now if the shadow face is what you’re feeding.`,
                situation: `Here ${name} describes the field of the question itself—the atmosphere, dynamic, or defining motif of the situation. Read surrounding cards as how this energy is distributed among people, timing, and choices.`,
                advice: `As advice, ${name} asks you to practice its integrated form. ${integHint} Prefer one concrete action over abstract intention: what would embodying ${name} look like in the next 48 hours?`,
                challenge: `As challenge or friction, ${name} often shows where the upright gift is blocked or exaggerated. ${shadowHint} The work is not to destroy this energy but to stop the costly version and recover the useful one.`,
                strength: `As strength or resource, ${name} is already on your side—or available if claimed. Lean on ${kw.toLowerCase()} deliberately. In a spread, this card can also show what to stop underestimating in yourself or the situation.`,
                other: `When ${name} speaks to another person (or an inner “other”), it describes their current stance or the face of them you’re meeting. Stay curious: is this their whole story, or a role in this dynamic? Avoid totalizing; use the card to improve dialogue and boundaries, not to diagnose permanently.`
            };
            return map[role] || map.present;
        }

        function renderPositionPrompts(card, frameKey) {
            const frame = SPREAD_FRAMES[frameKey] || SPREAD_FRAMES.ppf;
            return frame.positions.map(pos => `
                <div class="position-card">
                    <h4>${pos.title}</h4>
                    <p>${escapeHtml(positionText(card, pos.role))}</p>
                </div>
            `).join('');
        }

        function renderCardDetail(card) {
            const defaultFrame = 'ppf';
            const frameButtons = Object.entries(SPREAD_FRAMES).map(([key, frame]) =>
                `<button type="button" data-frame="${key}" class="${key === defaultFrame ? 'active' : ''}">${frame.label}</button>`
            ).join('');

            const html = `
                <button class="back-button" onclick="location.hash=''">&larr; Back to cards</button>
                <div class="card-detail">
                    <div class="card-detail-header">

                    </details>

                    ${card.traditional ? `

                    ${card.shadow ? `

                    ${card.reversed ? `

                    ${card.integration ? `

                    ${card.howToUse ? `

                    </details>
                    ` : ''}
                </div>
            `;
            contentEl.innerHTML = html;

            // Wire spread frame tabs
            const tabs = document.getElementById('spreadFrameTabs');
            const prompts = document.getElementById('positionPrompts');
            if (tabs && prompts) {
                tabs.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        tabs.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                        prompts.innerHTML = renderPositionPrompts(card, btn.dataset.frame);
                    });
                });
            }

            // Optional: dim image slightly when focusing reversed (visual cue)
            const btnU = document.getElementById('btnUprightView');
            const btnR = document.getElementById('btnReversedView');
            const img = document.getElementById('cardDetailImage');
            if (btnU && btnR) {
                btnU.addEventListener('click', () => {

                });
                btnR.addEventListener('click', () => {
                    btnR.classList.add('active');
                    btnU.classList.remove('active');
                    if (img) img.style.transform = 'rotate(180deg)';
                });
            }
        }

        // Switch between pages

        function initPolyDrag() {
            const container = document.getElementById('polyPlayground');
            if (!container) return;
            const polys = container.querySelectorAll('.poly');

            polys.forEach((el) => {
                let dragging = false;
                let startX = 0, startY = 0;
                let origX = 0, origY = 0;

                const getPoint = (e) => {
                    if (e.touches && e.touches.length) {
                        return { x: e.touches[0].clientX, y: e.touches[0].clientY };
                    }
                    return { x: e.clientX, y: e.clientY };
                };

                const onStart = (e) => {
                    e.preventDefault();
                    const pt = getPoint(e);
                    dragging = true;
                    el.classList.add('dragging');
                    // Position only — inner .poly-spin keeps rotating
                    const cRect = container.getBoundingClientRect();
                    const eRect = el.getBoundingClientRect();
                    origX = eRect.left + eRect.width / 2 - cRect.left;
                    origY = eRect.top + eRect.height / 2 - cRect.top;
                    startX = pt.x;
                    startY = pt.y;
                    el.style.left = origX + 'px';
                    el.style.top = origY + 'px';
                    el.style.transform = 'translate(-50%, -50%)';
                    el.style.animation = 'none';
                };

                const onMove = (e) => {
                    if (!dragging) return;
                    e.preventDefault();
                    const pt = getPoint(e);
                    const cRect = container.getBoundingClientRect();
                    let x = origX + (pt.x - startX);
                    let y = origY + (pt.y - startY);
                    x = Math.max(20, Math.min(cRect.width - 20, x));
                    y = Math.max(20, Math.min(cRect.height - 20, y));
                    el.style.left = x + 'px';
                    el.style.top = y + 'px';
                };

                const onEnd = () => {
                    if (!dragging) return;
                    dragging = false;
                    el.classList.remove('dragging');
                };

                el.addEventListener('pointerdown', onStart);
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onEnd);
                window.addEventListener('pointercancel', onEnd);
            });
        }

        function getAllCards() {
            let allCards = [];
            for (const suit in cardData) {
                allCards = allCards.concat(cardData[suit]);
            }
            return allCards;
        }

        // Search cards
        function searchCards(query) {
            if (!query) return getAllCards();
            const q = query.toLowerCase();
            return getAllCards().filter(card =>
                card.name.toLowerCase().includes(q) ||
                card.keywords.toLowerCase().includes(q)
            );
        }

        // Handle autocomplete search
        function handleSearchInput() {
            const query = searchInput.value.trim();
            const suggestionsEl = document.getElementById('suggestions');

            if (query.length === 0) {
                suggestionsEl.classList.remove('active');
                return;
            }

            const results = searchCards(query);
            if (results.length === 0) {
                suggestionsEl.classList.remove('active');
                return;
            }

            const html = results.map(card => `
                <div class="suggestion-item" onclick="navigateToCard('${card.id}')">
                    <span class="suggestion-name">${card.name}</span>
                    <span class="suggestion-suit">${card.suit}</span>
                </div>
            `).join('');

            suggestionsEl.innerHTML = html;
            suggestionsEl.classList.add('active');
        }

        // Navigate to a card from autocomplete
        function navigateToCard(cardId) {
            window.location.hash = cardId;
            searchInput.value = '';
            document.getElementById('suggestions').classList.remove('active');
        }

        // Handle navigation
        function handleNavigation() {
            const hash = window.location.hash.slice(1);

            if (hash) {
                const card = findCard(hash);
                if (card) {
                    renderCardDetail(card);
                    return;
                }
            }

            // Main page: show alchemical circle
            renderMainPage();
        }

        // Event listeners
        // Dropdown selection: go straight to the chosen card, then reset the dropdown
        function handleDropdownChange(e) {
            const id = e.target.value;
            if (!id) return;
            e.target.value = '';
            if (window.location.hash.slice(1) === id) {
                handleNavigation(); // same card already in the URL: hashchange won't fire
            } else {
                window.location.hash = id;
            }
        }
        [majorSelect, cupsSelect, swordsSelect, wandsSelect, pentaclesSelect]
            .forEach(sel => sel.addEventListener('change', handleDropdownChange));
        searchInput.addEventListener('input', handleSearchInput);
        window.addEventListener('hashchange', handleNavigation);

        // Close suggestions when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrapper')) {
                document.getElementById('suggestions').classList.remove('active');
            }
        });

        // Initialize
        populateDropdowns();
        handleNavigation();
    </script>
</body>
</html>
