                    traditional: "Completion, wholeness, fulfillment, and the end of a cycle. The World represents the completion of the Fool's Journey—the return home, but transformed by the journey. It speaks to the sense of wholeness, of all pieces fitting together, of having come full circle. When this card appears, it often suggests the end of a significant phase and the preparation for a new beginning. In practice, The World asks you to notice where this theme is already active in your life—not only as a future prediction, but as a present pattern. Context matters: upright emphasis often highlights the constructive face of the card, while challenging placements (or your own resistance to the message) may surface the same energy as friction, delay, or an invitation to grow. Read it in relationship to surrounding cards: they show whether this energy is beginning, peaking, resolving, or asking for a conscious choice. Historically and psychologically, this image belongs to a long lineage of symbols about how humans meet fate, desire, and responsibility—so the 'meaning' is less a fixed slogan than a living question you bring into the reading.",
                    jungian: "The Self in Wholeness & Individuation Complete:: The World represents the realization of the Self—the full integration of all parts of the psyche into a coherent whole. In Jungian terms, this is the goal of individuation—not to eliminate the shadow or the ego, but to integrate them into a larger whole under the direction of the Self. The World is the card of wholeness, of completing a cycle, of having become what you were meant to become. It's not the end of growth (that would be stagnation), but the completion of a chapter and the preparation for the next spiral of development. Return Home:: The World is also about coming home—returning to your essence, but transformed. You've left home in the Fool's Journey; you've been tested, broken down, rebuilt, integrated. Now you return, but you're not the same. This is the return home changed by the journey. From an archetypal view, The World can appear when a particular complex or developmental task is constellating—when the psyche is ready (or overdue) to make something conscious. Sallie Nichols and related Jungian tarot readers emphasize that the cards map stages and attitudes of consciousness, not merely external events; thus the 'situation' in a spread is often the ego's current relationship to an inner figure or energy. Pay attention to bodily felt sense and dream echoes around this card: the unconscious often elaborates the same motif in parallel. Individuation does not mean rejecting the card's difficulty; it means relating to it with enough ego strength that the energy can be integrated rather than acted out or repressed. Ask: what part of me is speaking here, and what does it need in order to move toward greater wholeness?",

                    integration: "Integrating The World means celebrating completion while remaining open to new beginnings, finding wholeness without becoming rigid, understanding that each ending is also a beginning. Integrated World energy means you can appreciate how far you've come while also remaining humble about how much there still is to learn. You complete things well—you don't just abandon them halfway through. You understand that life is cyclical—each completion brings a new beginning at a higher level. You carry the wisdom of one cycle into the next. You feel the satisfaction of integration while remaining open to the next phase of growth. You've become yourself, and you're ready for whatever comes next.  Integrated The World energy is recognizable in daily life as choice rather than compulsion: you can draw on this capacity when it serves, and set it down when it does not. Practically, integration looks like small, repeated acts—journal prompts, conversations, creative experiments, or boundary-setting—that embody the healthy form of the card. Over time, the psyche trusts that this energy has a seat at the table, so it no longer needs to shout through crisis. Wholeness is not a permanent state; it is a living relationship with the full range of your inner figures, including this one.",

                    traditional: "New emotional beginning, love, joy, and the opening of the heart. The Ace of Cups is the pure potential of feeling—an overflow of genuine emotion, spiritual blessing, or the start of a meaningful relationship. When it appears, something tender and true is being offered: a chance to feel deeply, to receive love, or to let the heart lead. In practice, Ace of Cups asks you to notice where this theme is already active in your life—not only as a future prediction, but as a present pattern. Context matters: upright emphasis often highlights the constructive face of the card, while challenging placements (or your own resistance to the message) may surface the same energy as friction, delay, or an invitation to grow. Read it in relationship to surrounding cards: they show whether this energy is beginning, peaking, resolving, or asking for a conscious choice. Historically and psychologically, this image belongs to a long lineage of symbols about how humans meet fate, desire, and responsibility—so the 'meaning' is less a fixed slogan than a living question you bring into the reading.",
                    jungian: "Emotional Potential Emerging from the Unconscious: The Ace of Cups represents the first stirring of authentic feeling from the deep psyche. In Jungian terms, it is the anima or the feeling function awakening—the capacity to value, to connect, and to be moved. The cup overflows because the unconscious is offering more than the ego can yet hold; the task is to receive without grasping or defending. This is eros in its nascent form: the pull toward relatedness and meaning through the heart rather than through will or intellect alone. The Spiritual Gift of Feeling: Unlike sentimentality, the Ace points to feeling as a psychic function equal to thinking. When this card appears, the Self may be inviting a more complete relationship to emotion—one that does not drown in it, nor dry it out into analysis. From an archetypal view, Ace of Cups can appear when a particular complex or developmental task is constellating—when the psyche is ready (or overdue) to make something conscious. Sallie Nichols and related Jungian tarot readers emphasize that the cards map stages and attitudes of consciousness, not merely external events; thus the 'situation' in a spread is often the ego's current relationship to an inner figure or energy. Pay attention to bodily felt sense and dream echoes around this card: the unconscious often elaborates the same motif in parallel. Individuation does not mean rejecting the card's difficulty; it means relating to it with enough ego strength that the energy can be integrated rather than acted out or repressed. Ask: what part of me is speaking here, and what does it need in order to move toward greater wholeness?",
                    shadow: "The shadow Ace of Cups is emotional flooding or emotional inflation—being overwhelmed by feeling and calling it depth, or idealizing a new connection so completely that reality cannot enter. It can also be the refusal of the gift: the cup is offered and you turn away, defending against vulnerability with cynicism or numbness. There is the shadow of addictive longing—chasing the high of new feeling without the capacity to sustain relationship. The shadow may also spiritualize emotion in a way that bypasses real human messiness.  Shadow work with Ace of Cups is not about self-attack; it is about honest recognition. Notice where you judge this energy in others while refusing it in yourself, or where you secretly indulge it while claiming the opposite virtue. In relationships, the shadow of this card often plays out as projection—seeing the problem as entirely 'out there.' In work and creativity, it may appear as a repeating pattern that undermines results. A useful practice is to write the shadow description in the first person ('I…') and notice what feels uncomfortably true. Integration begins when the disowned quality is given a legitimate, conscious channel rather than left to sabotage from the dark.",

                    jungian: "Harmonious Integration of Multiple Parts: Psychologically, the Three of Cups can represent the ego in good relation with several aspects of the psyche—or with a real community that mirrors inner plurality without chaos. Jung noted that individuation is not isolation; the Self includes relatedness. This card is the joy of belonging without enmeshment: shared feeling that enlarges rather than dissolves the individual. The Dionysian Gift: Celebration and ritual release have a place in psychic health. The Three invites conscious participation in collective joy as medicine, not as escape. From an archetypal view, Three of Cups can appear when a particular complex or developmental task is constellating—when the psyche is ready (or overdue) to make something conscious. Sallie Nichols and related Jungian tarot readers emphasize that the cards map stages and attitudes of consciousness, not merely external events; thus the 'situation' in a spread is often the ego's current relationship to an inner figure or energy. Pay attention to bodily felt sense and dream echoes around this card: the unconscious often elaborates the same motif in parallel. Individuation does not mean rejecting the card's difficulty; it means relating to it with enough ego strength that the energy can be integrated rather than acted out or repressed. Ask: what part of me is speaking here, and what does it need in order to move toward greater wholeness?",

                    jungian: "Satisfaction of the Feeling Function: Psychologically, this card can indicate a temporary alignment between desire and reality—the ego has enough, and gratitude is possible. Jung did not treat happiness as the goal of individuation, but neither did he dismiss ordinary fulfillment. The Nine of Cups is the right to enjoy emotional and sensual satisfaction without guilt, while remaining aware that contentment is a state, not a final identity. From an archetypal view, Nine of Cups can appear when a particular complex or developmental task is constellating—when the psyche is ready (or overdue) to make something conscious. Sallie Nichols and related Jungian tarot readers emphasize that the cards map stages and attitudes of consciousness, not merely external events; thus the 'situation' in a spread is often the ego's current relationship to an inner figure or energy. Pay attention to bodily felt sense and dream echoes around this card: the unconscious often elaborates the same motif in parallel. Individuation does not mean rejecting the card's difficulty; it means relating to it with enough ego strength that the energy can be integrated rather than acted out or repressed. Ask: what part of me is speaking here, and what does it need in order to move toward greater wholeness?",
                    shadow: "The shadow is smugness, emotional complacency, and the closed system of self-satisfaction that no longer grows. It can be hedonism without relatedness, or the belief that outer pleasure proves inner wholeness. There is also the shadow of envy when others have their nine cups and you do not. Shadow work with Nine of Cups is not about self-attack; it is about honest recognition. Notice where you judge this energy in others while refusing it in yourself, or where you secretly indulge it while claiming the opposite virtue. In relationships, the shadow of this card often plays out as projection—seeing the problem as entirely 'out there.' In work and creativity, it may appear as a repeating pattern that undermines results. A useful practice is to write the shadow description in the first person ('I…') and notice what feels uncomfortably true. Integration begins when the disowned quality is given a legitimate, conscious channel rather than left to sabotage from the dark.",
                    integration: "Integrating the Nine of Cups means receiving satisfaction with gratitude and humility. You enjoy what is good without needing it to be forever or to define you. Contentment coexists with continued openness to growth, relationship, and the next cycle. Integrated Nine of Cups energy is recognizable in daily life as choice rather than compulsion: you can draw on this capacity when it serves, and set it down when it does not. Practically, integration looks like small, repeated acts—journal prompts, conversations, creative experiments, or boundary-setting—that embody the healthy form of the card. Over time, the psyche trusts that this energy has a seat at the table, so it no longer needs to shout through crisis. Wholeness is not a permanent state; it is a living relationship with the full range of your inner figures, including this one.",

                    shadow: "The shadow is cruel honesty, intellectual inflation, and using truth as a blade to wound. It can be premature clarity that simplifies living complexity, or the addiction to being right. Mental aggression without heart belongs here. Shadow work with Ace of Swords is not about self-attack; it is about honest recognition. Notice where you judge this energy in others while refusing it in yourself, or where you secretly indulge it while claiming the opposite virtue. In relationships, the shadow of this card often plays out as projection—seeing the problem as entirely 'out there.' In work and creativity, it may appear as a repeating pattern that undermines results. A useful practice is to write the shadow description in the first person ('I…') and notice what feels uncomfortably true. Integration begins when the disowned quality is given a legitimate, conscious channel rather than left to sabotage from the dark.",
                    integration: "Integrating the Ace of Swords means welcoming clarity while tempering it with compassion and timing. You speak and think truthfully without needing to destroy. Insight becomes service to life, not domination of others or of the psyche's softer truths. Integrated Ace of Swords energy is recognizable in daily life as choice rather than compulsion: you can draw on this capacity when it serves, and set it down when it does not. Practically, integration looks like small, repeated acts—journal prompts, conversations, creative experiments, or boundary-setting—that embody the healthy form of the card. Over time, the psyche trusts that this energy has a seat at the table, so it no longer needs to shout through crisis. Wholeness is not a permanent state; it is a living relationship with the full range of your inner figures, including this one.",

        // ──── FILTER & DISPLAY LOGIC ────

        const contentEl = document.getElementById('content');
        const majorSelect = document.getElementById('majorSelect');
        const cupsSelect = document.getElementById('cupsSelect');
        const swordsSelect = document.getElementById('swordsSelect');
        const wandsSelect = document.getElementById('wandsSelect');
        const pentaclesSelect = document.getElementById('pentaclesSelect');
        const searchInput = document.getElementById('searchInput');

        // Populate dropdowns
        function populateDropdowns() {
            cardData.major.forEach(card => {
                const option = document.createElement('option');
                option.value = card.id;
                option.textContent = `${card.number}. ${card.name}`;
                majorSelect.appendChild(option);
            });

            [cupsSelect, swordsSelect, wandsSelect, pentaclesSelect].forEach((select, i) => {
                const suits = ['cups', 'swords', 'wands', 'pentacles'];
                const suit = suits[i];
                cardData[suit].forEach(card => {
                    const option = document.createElement('option');
                    option.value = card.id;
                    option.textContent = card.name;
                    select.appendChild(option);
                });
            });
        }

        // Find card by ID
        function findCard(id) {
            for (const suit in cardData) {
                const card = cardData[suit].find(c => c.id === id);
                if (card) return card;
            }
            return null;
        }

        // Render card detail page
        function renderCardDetail(card) {
            const html = `
                <button class="back-button" onclick="location.hash=''">&larr; Back to cards</button>
                <div class="card-detail">
                    <div class="card-detail-header">
                        <div class="card-detail-number">${card.suit}${card.number ? ' — ' + card.number : ''}</div>
                        <h2 class="card-detail-title">${card.name}</h2>
                        <p class="card-detail-keywords">${card.keywords}</p>
                    </div>

                    ${card.image ? `
                    <div class="card-image-section">
                        <img src="${card.image}" alt="${card.name}" class="card-image-display">
                    </div>
                    ` : ''}

                    ${card.traditional ? `
                    <div class="section">
                        <h3 class="section-title">Traditional Meaning</h3>
                        <p class="section-content">${card.traditional}</p>
                    </div>
                    ` : ''}

                    ${card.jungian ? `
                    <div class="section">
                        <h3 class="section-title">Jungian Perspective</h3>
                        <p class="section-content">${card.jungian}</p>
                    </div>
                    ` : ''}

                    ${card.shadow ? `
                    <div class="section">
                        <h3 class="section-title">Shadow Aspect</h3>
                        <p class="section-content">${card.shadow}</p>
                    </div>
                    ` : ''}

                    ${card.integration ? `
                    <div class="section">
                        <h3 class="section-title">Integration & Wholeness</h3>
                        <p class="section-content">${card.integration}</p>
                    </div>
                    ` : ''}

                    ${card.howToUse ? `
                    <div class="section">
                        <h3 class="section-title">How to Work With This Card in a Spread</h3>
                        <p class="section-content">${card.howToUse}</p>
                    </div>
                    ` : ''}
                </div>
            `;
            contentEl.innerHTML = html;
        }

        // Switch between pages
        function switchPage(page) {
            document.querySelectorAll('.nav-button').forEach(btn => btn.classList.remove('active'));
            
            if (page === 'dictionary') {
                document.getElementById('dictBtn').classList.add('active');
                renderMainPage();
            } else if (page === 'numerology') {
                document.getElementById('numerologyBtn').classList.add('active');
                renderNumerologyPage();
            } else if (page === 'suits') {
                document.getElementById('suitsBtn').classList.add('active');
                renderSuitsPage();
            }
            
            window.location.hash = '';
            searchInput.value = '';
            document.getElementById('suggestions').classList.remove('active');

                        <p style="color: var(--brown-dark); line-height: 1.8; margin-bottom: 1rem;"><strong>Core Meaning:</strong> Completion, fulfillment, wisdom earned, near the end, reflection. The number 9 brings closure and the lessons learned from a cycle.</p>
                        <p style="color: var(--brown-dark); line-height: 1.8; margin-bottom: 1rem;"><strong>In Tarot:</strong> Nine of Cups (wish fulfillment/contentment), Nine of Swords (anxiety/worry), Nine of Wands (resilience/near completion), Nine of Pentacles (abundance achieved). Nines represent being near the finish line with hard-won wisdom.</p>
                        <p style="color: var(--brown-dark); line-height: 1.8;"><strong>Application:</strong> When 9 appears, consider: What cycle is completing? What wisdom have you gained? What's ready to be fulfilled or released?</p>

                        <p style="color: var(--brown-dark); line-height: 1.8; margin-bottom: 1rem;"><strong>Core Meaning:</strong> Fulfillment, culmination, wholeness, return to unity, completion and new beginning. The number 10 represents the full circle returning to 1.</p>
                        <p style="color: var(--brown-dark); line-height: 1.8; margin-bottom: 1rem;"><strong>In Taromán:</strong> Ten of Cups (family/happiness), Ten of Swords (rock bottom/completion), Ten of Wands (burden/completion), Ten of Pentacles (legacy/completion). Tens represent the full expression of their suit's energy and the closing of one cycle before the next begins.</p>
                        <p style="color: var(--brown-dark); line-height: 1.8;"><strong>Application:</strong> When 10 appears, ask: What's being completed? How is this cycle coming to wholeness? What legacy or lasting change results from this completion?</p>
                    </div>

            `;

        }

        // Get all cards
        function getAllCards() {
            let allCards = [];
            for (const suit in cardData) {
                allCards = allCards.concat(cardData[suit]);
            }
            return allCards;
        }

        // Search cards
        function searchCards(query) {
            if (!query) return getAllCards();
            const q = query.toLowerCase();
            return getAllCards().filter(card =>
                card.name.toLowerCase().includes(q) ||
                card.keywords.toLowerCase().includes(q)
            );
        }

        // Handle autocomplete search
        function handleSearchInput() {
            const query = searchInput.value.trim();
            const suggestionsEl = document.getElementById('suggestions');

            if (query.length === 0) {
                suggestionsEl.classList.remove('active');
                return;
            }

            const results = searchCards(query);
            if (results.length === 0) {
                suggestionsEl.classList.remove('active');
                return;
            }

            const html = results.map(card => `
                <div class="suggestion-item" onclick="navigateToCard('${card.id}')">
                    <span class="suggestion-name">${card.name}</span>
                    <span class="suggestion-suit">${card.suit}</span>
                </div>
            `).join('');

            suggestionsEl.innerHTML = html;
            suggestionsEl.classList.add('active');
        }

        // Navigate to a card from autocomplete
        function navigateToCard(cardId) {
            window.location.hash = cardId;
            searchInput.value = '';
            document.getElementById('suggestions').classList.remove('active');
        }

        // Handle navigation
        function handleNavigation() {
            const hash = window.location.hash.slice(1);

            if (hash) {
                const card = findCard(hash);
                if (card) {
                    renderCardDetail(card);
                    return;
                }
            }

            // Main page: show alchemical circle
            renderMainPage();
        }

        // Event listeners
        // Dropdown selection: go straight to the chosen card, then reset the dropdown
        function handleDropdownChange(e) {
            const id = e.target.value;
            if (!id) return;
            e.target.value = '';
            if (window.location.hash.slice(1) === id) {
                handleNavigation(); // same card already in the URL: hashchange won't fire
            } else {
                window.location.hash = id;
            }
        }
        [majorSelect, cupsSelect, swordsSelect, wandsSelect, pentaclesSelect]
            .forEach(sel => sel.addEventListener('change', handleDropdownChange));
        searchInput.addEventListener('input', handleSearchInput);
        window.addEventListener('hashchange', handleNavigation);

        // Close suggestions when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-wrapper')) {
                document.getElementById('suggestions').classList.remove('active');
            }
        });

        // Initialize
        populateDropdowns();
        handleNavigation();
    </script>
</body>
